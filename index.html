<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classement des Matchs</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --gold: #f59e0b;
            --silver: #94a3b8;
            --bronze: #b45309;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-blue);
            margin-bottom: 30px;
        }

        .match-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .match-title {
            font-size: 1.5rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            margin-top: 0;
            color: #60a5fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        /* --- CORRECTION IPHONE : Largeurs fixes stables --- */
        .leaderboard-table th:nth-child(1), 
        .leaderboard-table td:nth-child(1) {
            width: 50px;
            min-width: 50px;
            text-align: left;
            flex-shrink: 0;
        }

        .leaderboard-table th:nth-child(2), 
        .leaderboard-table td:nth-child(2) {
            text-align: left;
        }

        .leaderboard-table th:nth-child(3), 
        .leaderboard-table td:nth-child(3) {
            width: 130px;
            text-align: left;
            color: var(--text-muted);
        }

        .leaderboard-table th:nth-child(4), 
        .leaderboard-table td:nth-child(4) {
            width: 80px;
            text-align: right;
            padding-right: 15px;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 12px 6px;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .leaderboard-table th {
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid #334155;
        }

        .leaderboard-table tr:not(:last-child) td {
            border-bottom: 1px solid #334155;
        }

        .rank {
            font-weight: bold;
        }

        .rank-1 { color: var(--gold); }
        .rank-2 { color: var(--silver); }
        .rank-3 { color: var(--bronze); }

        .score-cell {
            font-weight: bold;
        }

        .date-cell {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Masquage initial des lignes au-delà de la 3e place */
        .row-hidden {
            display: none !important;
        }

        .toggle-btn {
            background-color: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin: 15px auto 0;
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }

        .no-data {
            text-align: center;
            padding: 40px;
            background-color: var(--card-bg);
            border-radius: 12px;
            color: var(--text-muted);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Tableau des Classements</h1>
    <div id="classement-container">
        <div class="loading">Chargement des scores depuis Supabase...</div>
    </div>
</div>

<script>
    // ==========================================
// CONFIGURATION CONFIG SUPABASE
// ==========================================
const SUPABASE_URL = "https://bjwizitnhvcuvphdvvxx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_hSQEsCXaQs7O7W-lNCgmwA_gKZ_m-T_";
const SUPABASE_TABLE_NAME = "matchs"; // Le nom de votre table dans Supabase

    function echapperHTML(str) {
        if (!str) return "";
        return str.replace(/[&<>'"]/g, function(tag) {
            var equivalences = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
            return equivalences[tag] || tag;
        });
    }

    function extraireScoreNumerique(scoreTexte) {
        if (!scoreTexte) return 0;
        var nombreSains = scoreTexte.toString().replace('*', '').trim();
        return parseInt(nombreSains, 10) || 0;
    }

    function formaterDate(dateString) {
        if (!dateString) return "-";
        try {
            var date = new Date(dateString);
            return date.toLocaleDateString('fr-FR', {
                day: 'numeric',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit'
            }).replace(',', ' à');
        } catch (e) {
            return "-";
        }
    }

        // Gestion de l'affichage accordéon globale (Correction du bug NodeList)
    window.basculerAffichageMatch = function(codeMatch, totalJoueurs) {
        var tbody = document.getElementById('table-body-' + codeMatch);
        var btn = document.getElementById('btn-' + codeMatch);
        if (!tbody || !btn) return;

        var lignesMasquees = tbody.querySelectorAll('.js-row-extra');
        if (lignesMasquees.length === 0) return;

        // CORRECTION : On accède à classList sur le premier élément [0] et non sur la liste entière
        var estMasque = lignesMasquees[0].classList.contains('row-hidden');
        
        lignesMasquees.forEach(function(ligne) {
            if (estMasque) {
                ligne.classList.remove('row-hidden');
            } else {
                ligne.classList.add('row-hidden');
            }
        });

        if (estMasque) {
            btn.textContent = "Voir moins";
        } else {
            var nbRestants = totalJoueurs - 3;
            btn.textContent = "Voir plus (+" + nbRestants + ")";
        }
    };


    async function chargerClassement() {
        var container = document.getElementById('classement-container');
        var urlSupabase = SUPABASE_URL + '/rest/v1/' + SUPABASE_TABLE_NAME + '?select=*';

        try {
            var reponse = await fetch(urlSupabase, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                    'Content-Type': 'application/json'
                }
            });

            if (!reponse.ok) throw new Error("Erreur de récupération");

            var donnees = await reponse.json();

            if (donnees.length === 0) {
                container.innerHTML = '<div class="no-data">Aucun score disponible pour le moment.</div>';
                return;
            }

            // Tri strict
            donnees.sort(function(a, b) {
                var matchA = a.code_match.toUpperCase();
                var matchB = b.code_match.toUpperCase();
                if (matchA !== matchB) return matchA.localeCompare(matchB);

                var scoreA = extraireScoreNumerique(a.score_net);
                var scoreB = extraireScoreNumerique(b.score_net);
                if (scoreB !== scoreA) return scoreB - scoreA;

                var dateA = new Date(a.created_at || 0);
                var dateB = new Date(b.created_at || 0);
                return dateB - dateA;
            });

            var matchsRegroupes = {};
            donnees.forEach(function(ligne) {
                if (!matchsRegroupes[ligne.code_match]) {
                    matchsRegroupes[ligne.code_match] = [];
                }
                matchsRegroupes[ligne.code_match].push(ligne);
            });

            container.innerHTML = '';

            Object.keys(matchsRegroupes).forEach(function(codeMatch) {
                var joueurs = matchsRegroupes[codeMatch];
                var premierJoueur = joueurs[0] || {};
                var nbManches = premierJoueur.nb_manches ? premierJoueur.nb_manches : '-';
                var aPlusDeTroisJoueurs = joueurs.length > 3;
                
                var section = document.createElement('div');
                section.className = 'match-section';

                var htmlStructure = '';
                htmlStructure += '<div class="match-title">';
                htmlStructure += '  <span>Match : ' + echapperHTML(codeMatch) + '</span>';
                htmlStructure += '  <span style="font-size: 0.95rem; color: var(--text-muted); font-weight: normal;">(' + nbManches + ' manches)</span>';
                htmlStructure += '</div>';
                htmlStructure += '<table class="leaderboard-table">';
                htmlStructure += '  <thead>';
                htmlStructure += '    <tr>';
                htmlStructure += '      <th>Pos</th>';
                htmlStructure += '      <th>Joueur</th>';
                htmlStructure += '      <th>Date</th>';
                htmlStructure += '      <th style="text-align: right; padding-right: 15px;">Score</th>';
                htmlStructure += '    </tr>';
                htmlStructure += '  </thead>';
                htmlStructure += '  <tbody id="table-body-' + codeMatch + '"></tbody>';
                htmlStructure += '</table>';
                
                if (aPlusDeTroisJoueurs) {
    var nbRestants = joueurs.length - 3;
    htmlStructure += '<button id="btn-' + codeMatch + '" class="toggle-btn" onclick="basculerAffichageMatch(\'' + codeMatch + '\', ' + joueurs.length + ')">Voir plus (+' + nbRestants + ')</button>';
}


                section.innerHTML = htmlStructure;
                container.appendChild(section);

                var tbody = document.getElementById('table-body-' + codeMatch);
                var lignesHTML = '';

                joueurs.forEach(function(joueur, index) {
                    var rang = index + 1;
                    var classeRang = '';
                    if (rang === 1) classeRang = 'rank-1';
                    if (rang === 2) classeRang = 'rank-2';
                    if (rang === 3) classeRang = 'rank-3';

                    var classeExtra = rang > 3 ? 'js-row-extra row-hidden' : '';

                    lignesHTML += '<tr class="' + classeExtra + '">';
                    lignesHTML += '  <td class="rank ' + classeRang + '">#' + rang + '</td>';
                    lignesHTML += '  <td>' + echapperHTML(joueur.nom_joueur) + '</td>';
                    lignesHTML += '  <td class="date-cell">' + formaterDate(joueur.created_at) + '</td>';
                    lignesHTML += '  <td class="score-cell" style="text-align: right; padding-right: 15px;">' + echapperHTML(joueur.score_net) + '</td>';
                    lignesHTML += '</tr>';
                });
                
                tbody.innerHTML = lignesHTML;
            });

        } catch (erreur) {
            console.error(erreur);
            container.innerHTML = '<div class="no-data" style="color: #ef4444;">Erreur lors du chargement des classements.</div>';
        }
    }

    window.addEventListener('DOMContentLoaded', chargerClassement);
</script>
</body>
</html>
